<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Study Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: var(--card-bg);
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { margin: 0; font-size: 1.25rem; color: var(--accent); }
    .model-selector {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-color);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
    }
    .container { display: flex; flex: 1; overflow: hidden; }
    sidebar {
      width: 260px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .mode-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      text-align: left;
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .mode-btn.active, .mode-btn:hover {
      background: var(--bg-color);
      color: var(--text-color);
      border-color: var(--border);
    }
    main { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); }
    #chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message { max-width: 80%; padding: 1rem; border-radius: 12px; line-height: 1.5; }
    .user { align-self: flex-end; background: var(--accent); color: white; }
    .assistant { align-self: flex-start; background: var(--card-bg); border: 1px solid var(--border); }
    .input-area {
      padding: 1rem;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
    }
    textarea {
      flex: 1;
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-color);
      padding: 0.75rem;
      border-radius: 8px;
      resize: none;
      height: 48px;
      font-family: inherit;
    }
    button.send-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0 1.25rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎓 AI Study Assistant</h1>
    <div>
      <label style="font-size: 0.85rem; color: var(--text-muted); margin-right: 0.5rem;">AI Brain:</label>
      <select id="model-select" class="model-selector">
        <option value="gemini">Google Gemini (Flash)</option>
        <option value="openrouter">Llama 3.3 (via OpenRouter Free)</option>
      </select>
    </div>
  </header>

  <div class="container">
    <sidebar>
      <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.25rem;">LEARNING MODE</div>
      <button class="mode-btn active" onclick="setMode('socratic', this)">🧠 Socratic Tutor</button>
      <button class="mode-btn" onclick="setMode('feynman', this)">💡 Simple Explainer</button>
      <button class="mode-btn" onclick="setMode('quiz', this)">📝 Practice Quiz</button>
      <button class="mode-btn" onclick="setMode('summary', this)">📑 Note Summarizer</button>
    </sidebar>

    <main>
      <div id="chat-log">
        <div class="message assistant">
          Hello! I am your AI study assistant. Pick a mode on the left, choose your preferred AI model above, and let's study!
        </div>
      </div>

      <div class="input-area">
        <textarea id="user-input" placeholder="Ask a study question or paste notes..." onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </main>
  </div>

  <script>
    let currentMode = 'socratic';
    let chatHistory = [];

    const systemPrompts = {
      socratic: "You are an encouraging Socratic tutor. Do NOT give direct answers immediately. Guide the student step-by-step with questions and check for understanding.",
      feynman: "Explain academic topics using the Feynman Technique. Use ultra-simple everyday language, relatable analogies, and zero jargon.",
      quiz: "Generate 3 interactive multiple-choice questions on the topic. Do not give away the answers right away; ask the student to pick their options first.",
      summary: "Take the provided topic or text and break it down into: 1) Core Summary, 2) Key Terms & Definitions, and 3) 3 Quick Review Questions."
    };

    function setMode(mode, btn) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const inputField = document.getElementById('user-input');
      const text = inputField.value.trim();
      const modelSelection = document.getElementById('model-select').value;
      if (!text) return;

      appendMessage(text, 'user');
      chatHistory.push({ role: 'user', text: text });
      inputField.value = '';

      const loadingDiv = appendMessage('Thinking...', 'assistant');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            history: chatHistory,
            modelSelection: modelSelection,
            systemPrompt: systemPrompts[currentMode]
          })
        });

        const data = await res.json();
        if (data.error) {
          loadingDiv.innerHTML = `Error: ${data.error}`;
        } else {
          loadingDiv.innerHTML = marked.parse(data.reply);
          chatHistory.push({ role: 'assistant', text: data.reply });
        }
      } catch (err) {
        loadingDiv.innerHTML = "Connection error. Please try again.";
      }
    }

    function appendMessage(text, role) {
      const chatLog = document.getElementById('chat-log');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = role === 'user' ? text : marked.parse(text);
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
      return div;
    }
  </script>
</body>
</html>
